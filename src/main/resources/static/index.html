<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homeowners' Portal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f6f5e' d='M12 3 2 11h3v9h5v-6h4v6h5v-9h3z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>
        <span>Homeowners' Portal</span>
    </div>
    <div class="who" id="who" hidden>
        <div class="avatar" id="who-avatar"></div>
        <div class="who-text">
            <strong id="who-name"></strong>
            <small id="who-description"></small>
        </div>
        <button class="secondary" id="switch">Switch persona</button>
    </div>
</header>

<main id="app" class="container"></main>

<footer class="container footnote">
    The UI only hides what you may not use. Every request is checked again on the server, and each decision is
    written to the application log (logger <code>access</code>).
</footer>

<dialog id="persona-dialog" aria-labelledby="persona-title">
    <form method="dialog" class="dialog-body">
        <h2 id="persona-title">Who are you today?</h2>
        <p class="muted">No password needed. Pick a persona to see the portal through their eyes.</p>
        <div id="persona-list" class="persona-list"></div>
    </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
