spring.application.name=hoa-access-control

# Errors as RFC 9457 problem details, so the UI can show why a request failed.
spring.mvc.problemdetails.enabled=true
spring.web.error.include-message=always

# Permission-related activity: INFO shows enforced checks, filtered lists, persona switches and admin changes;
# DEBUG adds every single policy decision.
logging.level.access=INFO

# The policy is stored in an embedded H2 database (see PolicyStore). Point spring.datasource.url at another
# database to keep it elsewhere; the schema is created from the JPA model.
spring.jpa.open-in-view=false
