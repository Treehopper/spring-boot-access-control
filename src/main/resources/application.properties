spring.application.name=hoa-access-control

# Errors as RFC 9457 problem details, so the UI can show why a request failed.
spring.mvc.problemdetails.enabled=true
spring.web.error.include-message=always

# Permission-related activity: INFO shows enforced checks, filtered lists, persona switches and admin changes;
# DEBUG adds every single policy decision.
logging.level.access=INFO

# The domain and the permission policy are stored in an embedded H2 database (see Community and PolicyStore).
# Point spring.datasource.url at another database to keep them elsewhere; the schema is created from the JPA model.
# Each request has one persistence context, so permission checks and controllers can follow the associations
# between entities; endpoints that change data are @Transactional.
spring.jpa.open-in-view=true

# Look at the data at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:hoa, user sa, no password).
spring.datasource.url=jdbc:h2:mem:hoa
spring.h2.console.enabled=true
